services:
  mysql:
    image: mysql:8.0
    container_name: siiiweb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: siiiweb
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  redis:
    image: redis:6.2-alpine
    container_name: siiiweb-redis
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: siiiweb-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: siiiweb
      RABBITMQ_DEFAULT_PASS: siiiweb123
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: siiiweb-nacos
    environment:
      MODE: standalone
    ports: ["8848:8848", "9848:9848"]
  nginx:
    image: nginx:1.25-alpine
    container_name: siiiweb-nginx
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/siiiweb.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["1010:80"]
    depends_on: [nacos]
volumes:
  mysql_data:
