server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://host.docker.internal:1011; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
}
