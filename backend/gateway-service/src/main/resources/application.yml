server:
  port: 1011
spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: '*'
            allowedMethods: '*'
            allowedHeaders: '*'
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/admin/login,/api/admin/refresh,/api/about,/api/admin/about
        - id: article-service
          uri: lb://article-service
          predicates:
            - Path=/api/articles/**,/api/admin/articles/**
        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/api/projects/**,/api/admin/projects/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/comments/**,/api/admin/comments/**
        - id: statistics-service
          uri: lb://statistics-service
          predicates:
            - Path=/api/statistics/**
