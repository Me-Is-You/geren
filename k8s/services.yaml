apiVersion: apps/v1
kind: Deployment
metadata: { name: nacos, namespace: siiiweb }
spec:
  replicas: 1
  selector: { matchLabels: { app: nacos } }
  template:
    metadata: { labels: { app: nacos } }
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.3.2
          env: [ { name: MODE, value: standalone } ]
          ports: [ { containerPort: 8848 }, { containerPort: 9848 } ]
---
apiVersion: v1
kind: Service
metadata: { name: nacos, namespace: siiiweb }
spec: { selector: { app: nacos }, ports: [ { name: http, port: 8848, targetPort: 8848 }, { name: grpc, port: 9848, targetPort: 9848 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway-service, namespace: siiiweb }
spec: { replicas: 2, selector: { matchLabels: { app: gateway-service } }, template: { metadata: { labels: { app: gateway-service } }, spec: { containers: [ { name: gateway-service, image: siiiweb/gateway-service:1.0.0, ports: [ { containerPort: 1011 } ], envFrom: [ { configMapRef: { name: siiiweb-config } } ] } ] } } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway-service, namespace: siiiweb }
spec: { selector: { app: gateway-service }, ports: [ { port: 1011, targetPort: 1011 } ] }
---
