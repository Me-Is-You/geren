apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql, namespace: siiiweb }
spec: { replicas: 1, selector: { matchLabels: { app: mysql } }, template: { metadata: { labels: { app: mysql } }, spec: { containers: [ { name: mysql, image: mysql:8.0, env: [ { name: MYSQL_ROOT_PASSWORD, value: root123456 }, { name: MYSQL_DATABASE, value: siiiweb } ], ports: [ { containerPort: 3306 } ] } ] } } }
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: siiiweb }
spec: { selector: { app: mysql }, ports: [ { port: 3306, targetPort: 3306 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: siiiweb }
spec: { replicas: 1, selector: { matchLabels: { app: redis } }, template: { metadata: { labels: { app: redis } }, spec: { containers: [ { name: redis, image: redis:6.2-alpine, ports: [ { containerPort: 6379 } ] } ] } } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: siiiweb }
spec: { selector: { app: redis }, ports: [ { port: 6379, targetPort: 6379 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: siiiweb }
spec: { replicas: 1, selector: { matchLabels: { app: rabbitmq } }, template: { metadata: { labels: { app: rabbitmq } }, spec: { containers: [ { name: rabbitmq, image: rabbitmq:3.13-management, ports: [ { containerPort: 5672 }, { containerPort: 15672 } ] } ] } } }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: siiiweb }
spec: { selector: { app: rabbitmq }, ports: [ { name: amqp, port: 5672, targetPort: 5672 }, { name: ui, port: 15672, targetPort: 15672 } ] }
